# Two extra baselines on the full dev set, run with --match runs/<syn_dev200_dialogue run>:
#  - self_consistency with n fixed to match the dialogue's COST rather than its generated tokens:
#    dialogue $0.00418/problem (with prompt caching) / SC $0.00058 per sample = 7.2 -> 7 samples
#  - two_plus_judge: two independent CoT attempts (SC's first two draws) + a judge when they disagree,
#    i.e. independent openings + reconciliation without any back-and-forth
name: syn_dev200_baselines_extra
method: baselines
model: ${MODEL}
seed: 0
temperature: null
reasoning_effort: none
concurrency: 16
cache: true
prompt_cache: explicit
pricing: {input_per_mtok: 0.20, output_per_mtok: 1.20, cache_read_per_mtok: 0.02, cache_write_per_mtok: 0.25}   # gpt-5.6-luna, USD/Mtok

dataset:
  name: jsonl
  path: evals/subsets/synthetic_dev200.jsonl

baselines:
  methods: [self_consistency, two_plus_judge]
  sc_samples: 7
  sc_temperature: 0.7
